name: release

# Keeps a release PR open on main. Merging that PR tags the release (vX.Y.Z) and
# publishes a GitHub Release with notes built from Conventional Commits (ADR 0008).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
