# Runs a published image; no source checkout needed.
# Put this file and a .env next to each other, then: docker compose -f docker-compose.release.yml up -d
# Pin a version with APP_VERSION in .env (e.g. 1.2.0); default is the newest release.
services:
  app:
    image: ghcr.io/thammel/home-server:${APP_VERSION:-latest}
    container_name: flat-expenses
    # Restart after crashes and after the server reboots (unless stopped by hand).
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # The host reaches the container via the docker bridge, not 127.0.0.1. Trusting
      # its X-Forwarded-For is safe only because the port is bound to loopback above.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    volumes:
      - data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Database + daily backups. Survives image updates; `docker compose down -v` deletes it.
  data:
